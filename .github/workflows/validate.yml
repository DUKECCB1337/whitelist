name: validate-whitelist

on:
  push:
    branches: [main]
    paths: ["whitelist.json", "tools/validate_whitelist.py", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["whitelist.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 whitelist.json
        run: python3 tools/validate_whitelist.py whitelist.json
